<div class="countries-summary">
  <h2>Country leaderboard</h2>
  <div class="status" *ngIf="error() as e">{{ e }}</div>
  <table *ngIf="summaries().length">
    <thead><tr><th>#</th><th>Country</th><th>Quotas</th><th>Events</th><th>Medals</th></tr></thead>
    <tbody>
      <tr *ngFor="let s of summaries()">
        <td>{{ s.place }}</td>
        <td>
          <img *ngIf="flagUrl(s.country) as url" class="flag" [src]="url" [alt]="s.country" />
          {{ s.country }}
        </td>
        <td class="num">{{ s.totalQuotas }}</td>
        <td class="num">{{ s.totalEvents }}</td>
        <td class="num">{{ s.totalMedals }}</td>
      </tr>
    </tbody>
  </table>
  <div class="loading" *ngIf="loading()">Loading…</div>
</div>
